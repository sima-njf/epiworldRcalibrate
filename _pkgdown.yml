url: https://sima-njf.github.io/epiworldRcalibrate/
template:
  bootstrap: 5
  bslib:
    preset: bootstrap
build:
  new_process: false
navbar:
  title: "epiworldRcalibrate"
  left:
    - text: "Get Started"
      href: articles/calibrating-windows.html
    - text: "Articles"
      menu:
        - text: "Calibrating a window with DeepIMC and the standard methods"
          href: articles/calibrating-windows.html
        - text: "Real epidemic curves: smoothing, splitting and recovering the curve"
          href: articles/real-curves.html
        - text: "Interventions: where the curve changed, and the epidemic without the measure"
          href: articles/interventions.html
    - text: "Reference"
      href: reference/index.html
  right:
    - icon: fab fa-github
      href: "https://github.com/sima-njf/epiworldRcalibrate"
      aria-label: "GitHub"
home:
  title: "Calibration of agent-based epidemic models for epiworldR"
  description: >
    DeepIMC, a trained BiLSTM that calibrates SEIR and SIR agent-based models
    from daily counts in under a second, with ABC-SMC, ABC-MCMC, differential
    evolution and Nelder-Mead, whole-curve splitting and interventions.
authors:
  "Sima Najafzadehkhoei":
    href: "https://github.com/sima-njf"
  "George Vega Yon":
    href: "https://ggvy.cl"
  "Jake Wagoner":
    href: "https://github.com/JakeWags"
  "Bernardo Modenesi":
    href: "https://github.com/modenesi"
footer:
  structure:
    left: [developed_by, built_with]
    right: [package]
  components:
    developed_by: >
      Developed by
      [Sima Najafzadehkhoei](https://github.com/sima-njf),
      [George Vega Yon](https://github.com/gvegayon),
      [Jake Wagoner](https://github.com/JakeWags), and
      [Bernardo Modenesi](https://github.com/bmodenesi).
    built_with: "Built with [pkgdown](https://pkgdown.r-lib.org/)"
    package: "epiworldRcalibrate"
reference:
  - title: "Calibrate a window"
    desc: "DeepIMC and the four standard methods, for the SEIR and SIR models."
    contents:
      - calibrate_window
      - plot.window_fit
      - known_values
      - window_calibrator
      - window_baselines
      - calibrate
      - calibration_estimate
  - title: "Whole curves: smoothing, splitting, recovering"
    contents:
      - calibrate_curve
      - split_curve
      - smooth_cases
      - recover_curve
  - title: "Interventions"
    contents:
      - find_intervention
      - intervention_effect
      - plot.intervention_effect
  - title: "Predictions and scores"
    contents:
      - predict_cases
      - score_band
      - interval_score
      - compare_methods
      - plot_bands
      - plot_comparison
      - plot_estimates
      - plot_ptran_crate
  - title: "Data"
    contents:
      - outbreak_data
      - covid_waves_2020
      - interventions
      - disease_parameters
      - flu_baltimore_1918
      - covid_utah
      - admissions_utah
