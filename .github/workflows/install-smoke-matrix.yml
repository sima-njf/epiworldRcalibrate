name: Install smoke matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, final-version]

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  install-smoke:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R-${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
          needs: check

      - name: Install package from path with spaces + smoke test
        shell: Rscript {0}
        run: |
          old_warn <- getOption("warn")
          options(warn = 2)
          on.exit(options(warn = old_warn), add = TRUE)

          source_root <- normalizePath(".", winslash = "/", mustWork = TRUE)
          staged_root <- file.path(tempdir(), "ci path with spaces", "epiworldRcalibrate")

          dir.create(staged_root, recursive = TRUE, showWarnings = FALSE)
          entries <- list.files(source_root, all.files = TRUE, no.. = TRUE, full.names = TRUE)
          copied <- file.copy(entries, staged_root, recursive = TRUE)
          if (!all(copied)) {
            failed <- basename(entries[!copied])
            stop("Failed to copy files into staged path: ", paste(failed, collapse = ", "))
          }

          remotes::install_local(
            staged_root,
            upgrade = "never",
            dependencies = TRUE,
            force = TRUE,
            build = TRUE,
            build_opts = c("--no-build-vignettes", "--no-manual")
          )

          library(epiworldRcalibrate)
          options(warn = 1)

          # The shipped DeepIMC networks
          for (m in c("seir_window", "sir_window")) {
            nets <- list.files(system.file("models", m, package = "epiworldRcalibrate"), pattern = "^model\\.pt$",
                               recursive = TRUE)
            if (length(nets) != 5) stop("Expected 5 networks in models/", m, ", found ", length(nets))
          }

          # A short simulated SIR window
          sim <- epiworldR::ModelSIRCONN("smoke", n = 5000, prevalence = 0.002, contact_rate = 3,
                                         transmission_rate = 0.1, recovery_rate = 0.15)
          epiworldR::verbose_off(sim)
          epiworldR::run(sim, ndays = 41, seed = 3)
          tr <- epiworldR::get_hist_transition_matrix(sim)
          tr <- tr[tr$state_from == "Susceptible" & tr$state_to == "Infected", ]
          y <- tr$counts[match(1:40, tr$date)]
          y[is.na(y)] <- 0

          # A standard method (no Python)
          nm <- calibrate_window(y, model = "SIR", method = "NELDERMEAD", n = 5000, recov = 0.15,
                                 settings = list(maxit = 30))
          if (!is.finite(nm$estimate[["R0"]])) stop("Nelder-Mead returned a non-finite R0")

          # DeepIMC (reticulate provisions Python with torch the first time)
          fit <- calibrate_window(y, model = "SIR", method = "DeepIMC", n = 5000, recov = 0.15)
          if (!is.finite(fit$estimate[["R0"]]) || any(!is.finite(fit$intervals["R0", ])))
            stop("DeepIMC returned a non-finite R0 or range")
          fit_seir <- calibrate_window(y, model = "SEIR", method = "DeepIMC", known = known_values("COVID-19", "SEIR", n = 5000))
          if (!is.finite(fit_seir$estimate[["R0"]])) stop("DeepIMC (SEIR) returned a non-finite R0")

          cat("Installed successfully from:", normalizePath(staged_root, winslash = "/"), "\n")
          cat("Nelder-Mead R0:", nm$estimate[["R0"]], "\n")
          cat("DeepIMC R0 (SIR):", fit$estimate[["R0"]], "range", fit$intervals["R0", ], "\n")
          cat("DeepIMC R0 (SEIR):", fit_seir$estimate[["R0"]], "\n")
